[project]
name = "email-dupes"
version = "0.1.0"
description = "Find duplicate subscribers in a Drip account and email a report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
